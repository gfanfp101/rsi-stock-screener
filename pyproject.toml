[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-stock-screener"
version = "0.1.0"
description = "Daily U.S. stock screener for persistent RSI momentum"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rsi-screener = "rsi_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
